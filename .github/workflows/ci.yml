name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install protoc and build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake perl nasm

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc --yes

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Verify the C header is up to date
        shell: bash
        run: |
          cbindgen --config cbindgen.toml --crate friendshub-core --output /tmp/fh_check.h
          if ! diff -u include/friendshub_core.h /tmp/fh_check.h; then
            echo ""
            echo "The committed header is out of date."
            echo "Run locally:"
            echo "  cbindgen --config cbindgen.toml --crate friendshub-core --output include/friendshub_core.h"
            exit 1
          fi

