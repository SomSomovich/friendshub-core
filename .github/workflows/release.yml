name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PROTOC_VERSION: '29.3'

jobs:
  linux:
    name: linux ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            suffix: ubuntu22
          - runner: ubuntu-22.04-arm
            suffix: ubuntu22
          - runner: ubuntu-24.04
            suffix: ubuntu24
          - runner: ubuntu-24.04-arm
            suffix: ubuntu24
          - runner: ubuntu-26.04
            suffix: ubuntu26
          - runner: ubuntu-26.04-arm
            suffix: ubuntu26

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}

      - name: Install protoc
        run: |
          set -euo pipefail
          arch=$(uname -m)
          case "$arch" in
            x86_64)  a=x86_64 ;;
            aarch64) a=aarch_64 ;;
            *)       echo "unsupported arch: $arch"; exit 1 ;;
          esac
          url="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-${a}.zip"
          curl -fsSL -o /tmp/protoc.zip "$url"
          unzip -q -o /tmp/protoc.zip -d "$HOME/protoc"
          echo "$HOME/protoc/bin" >> "$GITHUB_PATH"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake perl nasm

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Build
        run: cargo build --release

      - name: Generate C header
        run: cbindgen --config cbindgen.toml --crate friendshub-core --output friendshub_core.h

      - name: Package
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then A=x64; else A=arm64; fi
          NAME=friendshub-core-linux-$A-${{ matrix.suffix }}
          mkdir -p dist/$NAME/lib dist/$NAME/include
          cp target/release/libfriendshub_core.so dist/$NAME/lib/
          cp target/release/libfriendshub_core.a dist/$NAME/lib/
          cp friendshub_core.h dist/$NAME/include/
          (cd dist && tar czf ../$NAME.tar.gz $NAME)

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: '*.tar.gz'
          if-no-files-found: error

  windows:
    name: windows ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            suffix: x64
          - runner: windows-11-arm
            suffix: arm64

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}

      - name: Install protoc
        shell: pwsh
        run: |
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v$env:PROTOC_VERSION/protoc-$env:PROTOC_VERSION-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\protoc.zip"
          Expand-Archive -Path "$env:TEMP\protoc.zip" -DestinationPath "$env:USERPROFILE\protoc" -Force
          "$env:USERPROFILE\protoc\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Build
        run: cargo build --release

      - name: Generate C header
        run: cbindgen --config cbindgen.toml --crate friendshub-core --output friendshub_core.h

      - name: Package
        shell: pwsh
        run: |
          $name = "friendshub-core-windows-${{ matrix.suffix }}"
          New-Item -ItemType Directory -Force -Path "dist/$name/bin","dist/$name/lib","dist/$name/include" | Out-Null
          Copy-Item target/release/friendshub_core.dll "dist/$name/bin/"
          Copy-Item target/release/friendshub_core.dll.lib "dist/$name/lib/"
          Copy-Item target/release/friendshub_core.lib "dist/$name/lib/"
          Copy-Item friendshub_core.h "dist/$name/include/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.suffix }}
          path: '*.zip'
          if-no-files-found: error

  apple:
    name: apple ${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            suffix: macos-x64
          - runner: macos-26
            target: aarch64-apple-darwin
            suffix: macos-arm64
          - runner: macos-26
            target: aarch64-apple-ios
            suffix: ios-arm64
          - runner: macos-26
            target: aarch64-apple-ios-sim
            suffix: ios-arm64-simulator

    env:
      # The cc builder ignores IPHONEOS_DEPLOYMENT_TARGET; cmake honours it,
      # and aws-lc-sys needs a deployment target of at least 13.0 so that
      # ___chkstk_darwin resolves against the SDK. The default the cc builder
      # uses is 10.0, which is where the link failed.
      AWS_LC_SYS_CMAKE_BUILDER: '1'
      IPHONEOS_DEPLOYMENT_TARGET: '14.0'
      MACOSX_DEPLOYMENT_TARGET: '11.0'

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.suffix }}

      - name: Install protoc
        run: brew install protobuf

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Generate C header
        run: cbindgen --config cbindgen.toml --crate friendshub-core --output friendshub_core.h

      - name: Package
        run: |
          NAME=friendshub-core-${{ matrix.suffix }}
          mkdir -p dist/$NAME/lib dist/$NAME/include
          T=target/${{ matrix.target }}/release
          case "${{ matrix.target }}" in
            *ios-sim|*ios) cp "$T/libfriendshub_core.a" dist/$NAME/lib/ ;;
            *darwin)     cp "$T/libfriendshub_core.dylib" dist/$NAME/lib/; cp "$T/libfriendshub_core.a" dist/$NAME/lib/ ;;
          esac
          cp friendshub_core.h dist/$NAME/include/
          (cd dist && tar czf ../$NAME.tar.gz $NAME)

      - uses: actions/upload-artifact@v4
        with:
          name: apple-${{ matrix.suffix }}
          path: '*.tar.gz'
          if-no-files-found: error

  android:
    name: android
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27d
          add-to-path: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Install protoc
        run: |
          set -euo pipefail
          url="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          curl -fsSL -o /tmp/protoc.zip "$url"
          unzip -q -o /tmp/protoc.zip -d "$HOME/protoc"
          echo "$HOME/protoc/bin" >> "$GITHUB_PATH"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake perl nasm

      - name: Install cbindgen and cargo-ndk
        run: |
          cargo install cbindgen --locked
          cargo install cargo-ndk --locked

      - name: Build all ABIs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            --platform 26 \
            -o android-out \
            build --release

      - name: Generate C header
        run: cbindgen --config cbindgen.toml --crate friendshub-core --output friendshub_core.h

      - name: Package
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            NAME=friendshub-core-android-$abi
            mkdir -p dist/$NAME/lib dist/$NAME/include
            cp android-out/$abi/libfriendshub_core.so dist/$NAME/lib/
            cp friendshub_core.h dist/$NAME/include/
            (cd dist && tar czf ../$NAME.tar.gz $NAME)
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: '*.tar.gz'
          if-no-files-found: error

  publish:
    name: publish
    needs: [linux, windows, apple, android]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List collected artifacts
        run: ls -la artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true

