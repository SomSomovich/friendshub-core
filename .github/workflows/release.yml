name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Linux (x64 + arm64) on three Ubuntu generations
  # ---------------------------------------------------------------------------
  linux:
    name: linux ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            suffix: ubuntu22
            lib: libfriendshub_core.so
          - runner: ubuntu-22.04-arm
            suffix: ubuntu22
            lib: libfriendshub_core.so
          - runner: ubuntu-24.04
            suffix: ubuntu24
            lib: libfriendshub_core.so
          - runner: ubuntu-24.04-arm
            suffix: ubuntu24
            lib: libfriendshub_core.so
          - runner: ubuntu-26.04
            suffix: ubuntu26
            lib: libfriendshub_core.so
          - runner: ubuntu-26.04-arm
            suffix: ubuntu26
            lib: libfriendshub_core.so

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake perl nasm

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Build
        run: cargo build --release

      - name: Generate C header
        run: cbindgen --config cbindgen.toml --crate friendshub-core --output friendshub_core.h

      - name: Package
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then A=x64; else A=arm64; fi
          NAME=friendshub-core-linux-$A-${{ matrix.suffix }}
          mkdir -p dist/$NAME/lib dist/$NAME/include
          cp target/release/${{ matrix.lib }} dist/$NAME/lib/
          cp target/release/libfriendshub_core.a dist/$NAME/lib/
          cp friendshub_core.h dist/$NAME/include/
          cd dist && tar czf ../$NAME.tar.gz $NAME

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: '*.tar.gz'
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows (x64 + arm64)
  # ---------------------------------------------------------------------------
  windows:
    name: windows ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            suffix: x64
          - runner: windows-11-arm
            suffix: arm64

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install protoc
        run: choco install protoc --yes

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Build
        run: cargo build --release

      - name: Generate C header
        run: cbindgen --config cbindgen.toml --crate friendshub-core --output friendshub_core.h

      - name: Package
        shell: pwsh
        run: |
          $name = "friendshub-core-windows-${{ matrix.suffix }}"
          New-Item -ItemType Directory -Force -Path "dist/$name/bin","dist/$name/lib","dist/$name/include" | Out-Null
          Copy-Item target/release/friendshub_core.dll "dist/$name/bin/"
          Copy-Item target/release/friendshub_core.dll.lib "dist/$name/lib/"
          Copy-Item target/release/friendshub_core.lib "dist/$name/lib/"
          Copy-Item friendshub_core.h "dist/$name/include/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.suffix }}
          path: '*.zip'
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS (Intel + Apple Silicon) and iOS (device + simulator)
  # ---------------------------------------------------------------------------
  apple:
    name: apple ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            targets: x86_64-apple-darwin
            suffix: macos-x64
          - runner: macos-26
            targets: aarch64-apple-darwin
            suffix: macos-arm64
          - runner: macos-26
            targets: aarch64-apple-ios
            suffix: ios-arm64
          - runner: macos-26
            targets: aarch64-apple-ios-sim
            suffix: ios-arm64-simulator

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install protoc
        run: brew install protobuf

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Build
        run: cargo build --release --target ${{ matrix.targets }}

      - name: Generate C header
        run: cbindgen --config cbindgen.toml --crate friendshub-core --output friendshub_core.h

      - name: Package
        run: |
          NAME=friendshub-core-${{ matrix.suffix }}
          mkdir -p dist/$NAME/lib dist/$NAME/include
          if [[ "${{ matrix.targets }}" == *"ios"* ]]; then
            cp target/${{ matrix.targets }}/release/libfriendshub_core.a dist/$NAME/lib/
          elif [[ "${{ matrix.targets }}" == *"darwin"* ]]; then
            cp target/${{ matrix.targets }}/release/libfriendshub_core.dylib dist/$NAME/lib/
            cp target/${{ matrix.targets }}/release/libfriendshub_core.a dist/$NAME/lib/
          fi
          cp friendshub_core.h dist/$NAME/include/
          cd dist && tar czf ../$NAME.tar.gz $NAME

      - uses: actions/upload-artifact@v4
        with:
          name: apple-${{ matrix.suffix }}
          path: '*.tar.gz'
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android: three ABIs in one job, NDK r27, API 26 (Android 8)
  # ---------------------------------------------------------------------------
  android:
    name: android
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27d
          add-to-path: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake perl nasm

      - name: Install cbindgen and cargo-ndk
        run: |
          cargo install cbindgen --locked
          cargo install cargo-ndk --locked

      - name: Build all ABIs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            --platform 26 \
            -o android-out \
            build --release

      - name: Generate C header
        run: cbindgen --config cbindgen.toml --crate friendshub-core --output friendshub_core.h

      - name: Package
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            NAME=friendshub-core-android-$abi
            mkdir -p dist/$NAME/lib dist/$NAME/include
            cp android-out/$abi/libfriendshub_core.so dist/$NAME/lib/
            cp friendshub_core.h dist/$NAME/include/
            (cd dist && tar czf ../$NAME.tar.gz $NAME)
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: '*.tar.gz'
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish: collect every artifact and attach to a GitHub Release
  # ---------------------------------------------------------------------------
  publish:
    name: publish
    needs: [linux, windows, apple, android]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List collected artifacts
        run: ls -la artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.tar.gz
          fail_on_unmatched_files: true

