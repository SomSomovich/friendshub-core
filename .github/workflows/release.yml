name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: linux ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            suffix: ubuntu22
          - runner: ubuntu-22.04-arm
            suffix: ubuntu22
          - runner: ubuntu-24.04
            suffix: ubuntu24
          - runner: ubuntu-24.04-arm
            suffix: ubuntu24
          - runner: ubuntu-26.04
            suffix: ubuntu26
          - runner: ubuntu-26.04-arm
            suffix: ubuntu26

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake perl nasm

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Build
        run: cargo build --release

      - name: Generate C header
        run: cbindgen --config cbindgen.toml --crate friendshub-core --output friendshub_core.h

      - name: Package
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then A=x64; else A=arm64; fi
          NAME=friendshub-core-linux-$A-${{ matrix.suffix }}
          mkdir -p dist/$NAME/lib dist/$NAME/include
          cp target/release/libfriendshub_core.so dist/$NAME/lib/
          cp target/release/libfriendshub_core.a dist/$NAME/lib/
          cp friendshub_core.h dist/$NAME/include/
          (cd dist && tar czf ../$NAME.tar.gz $NAME)

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: '*.tar.gz'
          if-no-files-found: error

  windows:
    name: windows ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            suffix: x64
          - runner: windows-11-arm
            suffix: arm64

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Build
        run: cargo build --release

      - name: Generate C header
        run: cbindgen --config cbindgen.toml --crate friendshub-core --output friendshub_core.h

      - name: Package
        shell: pwsh
        run: |
          $name = "friendshub-core-windows-${{ matrix.suffix }}"
          New-Item -ItemType Directory -Force -Path "dist/$name/bin","dist/$name/lib","dist/$name/include" | Out-Null
          Copy-Item target/release/friendshub_core.dll "dist/$name/bin/"
          Copy-Item target/release/friendshub_core.dll.lib "dist/$name/lib/"
          Copy-Item target/release/friendshub_core.lib "dist/$name/lib/"
          Copy-Item friendshub_core.h "dist/$name/include/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.suffix }}
          path: '*.zip'
          if-no-files-found: error

  apple:
    name: apple ${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            suffix: macos-x64
          - runner: macos-26
            target: aarch64-apple-darwin
            suffix: macos-arm64
          - runner: macos-26
            target: aarch64-apple-ios
            suffix: ios-arm64
          - runner: macos-26
            target: aarch64-apple-ios-sim
            suffix: ios-arm64-simulator

    env:
      # aws-lc-sys references ___chkstk_darwin, which lives in the iOS 13+
      # SDK. With the historical default of iOS 10 the symbol is undefined and
      # the link fails. 13 is also the current App Store minimum, so there is
      # no reason to go lower.
      IPHONEOS_DEPLOYMENT_TARGET: '13.0'
      MACOSX_DEPLOYMENT_TARGET: '11.0'

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.suffix }}

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Generate C header
        run: cbindgen --config cbindgen.toml --crate friendshub-core --output friendshub_core.h

      - name: Package
        run: |
          NAME=friendshub-core-${{ matrix.suffix }}
          mkdir -p dist/$NAME/lib dist/$NAME/include
          T=target/${{ matrix.target }}/release
          case "${{ matrix.target }}" in
            *ios-sim|*ios) cp "$T/libfriendshub_core.a" dist/$NAME/lib/ ;;
            *darwin)     cp "$T/libfriendshub_core.dylib" dist/$NAME/lib/; cp "$T/libfriendshub_core.a" dist/$NAME/lib/ ;;
          esac
          cp friendshub_core.h dist/$NAME/include/
          (cd dist && tar czf ../$NAME.tar.gz $NAME)

      - uses: actions/upload-artifact@v4
        with:
          name: apple-${{ matrix.suffix }}
          path: '*.tar.gz'
          if-no-files-found: error

  android:
    name: android
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27d
          add-to-path: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake perl nasm

      - name: Install cbindgen and cargo-ndk
        run: |
          cargo install cbindgen --locked
          cargo install cargo-ndk --locked

      - name: Build all ABIs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            --platform 26 \
            -o android-out \
            build --release

      - name: Generate C header
        run: cbindgen --config cbindgen.toml --crate friendshub-core --output friendshub_core.h

      - name: Package
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            NAME=friendshub-core-android-$abi
            mkdir -p dist/$NAME/lib dist/$NAME/include
            cp android-out/$abi/libfriendshub_core.so dist/$NAME/lib/
            cp friendshub_core.h dist/$NAME/include/
            (cd dist && tar czf ../$NAME.tar.gz $NAME)
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: '*.tar.gz'
          if-no-files-found: error

  publish:
    name: publish
    needs: [linux, windows, apple, android]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List collected artifacts
        run: ls -la artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true

