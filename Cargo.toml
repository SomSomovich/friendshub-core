[package]
name = "friendshub-core"
version = "0.2.1"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
description = "FriendsHub core client library: transport, auth, Signal E2E, everything between the UI and the server."
repository = "https://github.com/SomSomovich/friendshub-core"
authors = ["SomSomovich"]
publish = false

[workspace]
members = ["bindings/wasm"]
default-members = ["."]
resolver = "3"

[lib]
name = "friendshub_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
# --- Async runtime (native) ---
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"], optional = true }
futures = { version = "0.3", optional = true }
async-trait = { version = "0.1.92", optional = true }

# --- Transport ---
# reqwest 0.13: rustls is the default TLS backend; rustls-tls renamed to rustls.
# query and form are now separate features, disabled by default.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "multipart", "query", "form"], optional = true }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"], optional = true }

# --- TLS ---
rustls = { version = "0.23.46", optional = true }
rustls-platform-verifier = { version = "0.7.1", optional = true }
webpki-roots = { version = "1.0.9", optional = true }

# --- Protobuf (WS wire only) ---
# prost 0.14: prost-derive feature renamed to derive.
prost = { version = "0.14.4", features = ["derive"] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"

# --- Database ---
# sqlx 0.9: runtime and TLS features split; native SQLite is linked through SQLCipher.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "_sqlite", "sqlx-sqlite", "macros", "migrate"], optional = true }
sqlx-sqlite = { version = "0.9.0", optional = true }
libsqlite3-sys = { version = "=0.37.0", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"], optional = true }

# --- Signal E2E crypto ---
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.103.1", optional = true }

# --- WebRTC ---
# webrtc 0.21 is the 1.0 release candidate. API frozen until 1.0.0.
webrtc = { version = "0.21.1", optional = true }
# rtc-media is a sibling of rtc in the same workspace. Sample lives here,
# not in rtc: the rtc crate re-exports it only when its media feature is
# enabled, which the default feature set does not.
rtc-media = { version = "0.21.1", optional = true }
# rtc is the Sans-I/O core under webrtc. It is a transitive dependency, but
# the track and sample types live in it and must be named directly. The
# version is pinned to match the webrtc release, so both crates see the
# same types.
rtc = { version = "0.21.1", optional = true }
# rtc-media is a sibling of rtc in the same workspace. Sample lives here,
# not in rtc: the rtc crate re-exports it only when its media feature is
# enabled, which the default feature set does not.

# --- Utilities ---
anyhow = { version = "1.0.103", optional = true }
thiserror = "2.0.21"
hex = { version = "0.4.3", optional = true }
base64 = { version = "0.23.1", optional = true }
uuid = { version = "1.28.0", features = ["v4", "v5", "v7"], optional = true }
# rand 0.10: Rng renamed to RngExt, OsRng renamed to SysRng.
rand = { version = "0.10.3", optional = true }
# libsignal-protocol 0.103.1 exposes APIs bounded by rand 0.9 traits, so keep
# a named compatibility dependency for RNGs passed into Signal operations.
signal-rand = { package = "rand", version = "0.9.5", optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"], optional = true }
url = { version = "2.5.8", optional = true }
parking_lot = { version = "0.12.5", optional = true }
crossbeam-channel = { version = "0.5.16", optional = true }
once_cell = { version = "1.21.4", optional = true }
zeroize = { version = "1.9.0", features = ["derive"], optional = true }
fs2 = { version = "0.4.3", optional = true }
libc = { version = "0.2", optional = true }
chacha20poly1305 = { version = "0.11.0", optional = true }
bytes = { version = "1", optional = true }

# Secure platform stores are native-only; WASM keeps no key-store dependency.
keyring-core = { version = "1", optional = true }
sha2 = { version = "0.10.9", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"], optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = { version = "1", optional = true }
ndk-context = { version = "0.1.1", optional = true }
jni = { version = "0.21", optional = true }

[build-dependencies]
prost-build = "0.14.4"

[features]
default = ["native"]
native = [
    "dep:anyhow",
    "dep:keyring-core",
    "dep:sha2",
    "dep:zbus-secret-service-keyring-store",
    "dep:apple-native-keyring-store",
    "dep:windows-native-keyring-store",
    "dep:android-native-keyring-store",
    "dep:ndk-context",
    "dep:jni",
    "dep:async-trait",
    "dep:base64",
    "dep:bytes",
    "dep:chacha20poly1305",
    "dep:crossbeam-channel",
    "dep:futures",
    "dep:fs2",
    "dep:hex",
    "dep:libc",
    "dep:libsignal-protocol",
    "dep:libsqlite3-sys",
    "dep:once_cell",
    "dep:parking_lot",
    "dep:rand",
    "dep:reqwest",
    "dep:rtc",
    "dep:rtc-media",
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:signal-rand",
    "dep:sqlx",
    "dep:sqlx-sqlite",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:url",
    "dep:uuid",
    "dep:webrtc",
    "dep:webpki-roots",
    "dep:zeroize",
]
wasm = ["dep:base64", "dep:chacha20poly1305", "dep:hex", "dep:rand"]
# Integration tests that exercise file-backed clients opt into the volatile
# keyring mock explicitly; normal/release builds always use the OS store.
test-keyring = ["native"]

[[test]]
name = "avatar_upload_flow"
path = "tests/avatar_upload_flow.rs"
required-features = ["test-keyring"]

[[test]]
name = "bot_api"
path = "tests/bot_api.rs"
required-features = ["test-keyring"]

[[test]]
name = "db_encryption"
path = "tests/db_encryption.rs"
required-features = ["test-keyring"]

[[test]]
name = "db_entrypoints"
path = "tests/db_entrypoints.rs"
required-features = ["test-keyring"]

[[test]]
name = "group_sender_key_regressions"
path = "tests/group_sender_key_regressions.rs"
required-features = ["test-keyring"]

[[test]]
name = "push_callbacks"
path = "tests/push_callbacks.rs"
required-features = ["test-keyring"]

[[test]]
name = "rest_protobuf"
path = "tests/rest_protobuf.rs"
required-features = ["test-keyring"]

[[test]]
name = "rest_protobuf_parity"
path = "tests/rest_protobuf_parity.rs"
required-features = ["test-keyring"]

[[test]]
name = "typed_client"
path = "tests/typed_client.rs"
required-features = ["test-keyring"]

[[test]]
name = "websocket_push"
path = "tests/websocket_push.rs"
required-features = ["test-keyring"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# Do NOT set panic = "abort". catch_unwind across the C ABI requires unwind.
