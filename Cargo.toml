[package]
name = "friendshub-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
description = "FriendsHub core client library: transport, auth, Signal E2E, everything between the UI and the server."
repository = "https://github.com/SomSomovich/friendshub-core"
authors = ["SomSomovich"]
publish = false

[lib]
name = "friendshub_core"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# --- Async runtime ---
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
futures = "0.3"
async-trait = "0.1.92"

# --- Transport ---
# reqwest 0.13: rustls is the default TLS backend; rustls-tls renamed to rustls.
# query and form are now separate features, disabled by default.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "multipart", "query", "form"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

# --- TLS ---
rustls = "0.23.45"
rustls-platform-verifier = "0.7.0"
webpki-roots = "1.0.7"

# --- Protobuf (WS wire only) ---
# prost 0.14: prost-derive feature renamed to derive.
prost = { version = "0.14.4", features = ["derive"] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Database ---
# sqlx 0.9: runtime and TLS features split. Bundled SQLite via sqlx-sqlite.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "migrate"] }
sqlx-sqlite = { version = "0.9.0", features = ["bundled"] }

# --- Signal E2E crypto ---
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.103.1" }

# --- WebRTC ---
# webrtc 0.21 is the 1.0 release candidate. API frozen until 1.0.0.
webrtc = "0.21.0"

# --- Utilities ---
anyhow = "1.0.103"
thiserror = "2.0.21"
hex = "0.4.3"
base64 = "0.23.1"
uuid = { version = "1.26.1", features = ["v4", "v5", "v7"] }
# rand 0.10: Rng renamed to RngExt, OsRng renamed to SysRng.
rand = "0.9.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
parking_lot = "0.12.5"
crossbeam-channel = "0.5.16"
once_cell = "1.21.4"
zeroize = { version = "1.9.0", features = ["derive"] }

# keyring 4.x is deprecated and split. Do not enable until we decide on a
# secure storage approach. See docs/ for notes.
keyring = { version = "4.1.5", optional = true }

[build-dependencies]
prost-build = "0.14.4"

[features]
default = []
keyring = ["dep:keyring"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# Do NOT set panic = "abort". catch_unwind across the C ABI requires unwind.
