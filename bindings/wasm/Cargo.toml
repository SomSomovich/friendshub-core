[package]
name = "friendshub-core-wasm"
version = "0.1.5"
edition = "2024"
rust-version = "1.98"
publish = false
license = "AGPL-3.0-only"
description = "Browser bindings for FriendsHub core REST, push, Signal, and WebRTC transports"
repository = "https://github.com/SomSomovich/friendshub-core"

[package.metadata.wasm-pack.profile.release]
# Rust 1.98 emits bulk-memory and non-trapping float-to-int instructions for
# wasm32. Binaryen 117 needs these target features enabled explicitly.
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
friendshub-core = { path = "../..", default-features = false, features = ["wasm"] }
async-trait = "0.1.92"
hex = "0.4.3"
js-sys = "0.3"
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.103.1" }
prost = "0.14.4"
rand = "0.9.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = "1.28.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "BinaryType",
    "Blob",
    "Event",
    "Headers",
    "Location",
    "CloseEvent",
    "MessageEvent",
    "Request",
    "RequestCache",
    "RequestInit",
    "Response",
    "Window",
    "WebSocket",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rand 0.9 and libsignal use getrandom 0.3; the JS backend is Web Crypto.
getrandom = { version = "0.3.4", features = ["wasm_js"] }
# These versions arrive transitively through crypto dependencies and need
# their browser backends enabled independently.
getrandom02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4.3", features = ["wasm_js"] }
console_error_panic_hook = "0.1"
