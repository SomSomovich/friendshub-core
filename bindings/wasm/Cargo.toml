[package]
name = "friendshub-core-wasm"
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
publish = false
license = "AGPL-3.0-only"
description = "Browser bindings for FriendsHub core REST, push, and WebRTC transports"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
friendshub-core = { path = "../..", default-features = false, features = ["wasm"] }
js-sys = "0.3"
prost = "0.14.4"
serde_json = "1"
url = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "BinaryType",
    "Blob",
    "Event",
    "Headers",
    "Location",
    "CloseEvent",
    "MessageEvent",
    "Request",
    "RequestInit",
    "Response",
    "Window",
    "WebSocket",
] }
