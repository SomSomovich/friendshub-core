# cbindgen configuration for the C ABI header.
#
# Invoke from the repo root:
#   cbindgen --config cbindgen.toml --crate friendshub-core --output include/friendshub_core.h

language = "C"
cpp_compat = false
include_guard = "FRIENDSHUB_CORE_H"
pragma_once = true
autogen_warning = "/* Generated by cbindgen from friendshub-core. Do not edit. */"
include_version = true
documentation = true
documentation_style = "doxy"
tab_width = 4
line_length = 100
sort_by = "Name"
usize_is_size_t = true

[export]
# Applies to types and constants. The functions are already named fh_*, so
# a prefix here would either double up or (as of 0.29) leak as a stray token
# before the return type.
prefix = "FH_"
include = []

[fn]
args = "horizontal"
rename_args = "snake_case"

[struct]
rename_fields = "snake_case"
derive_constructor = false
derive_eq = false
derive_neq = false

[enum]
prefix_with_name = true
rename_variants = "snake_case"
